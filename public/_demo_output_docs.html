<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>产出物 Demo</title>
  <link rel="stylesheet" href="/css/tailwind.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'PingFang SC','Microsoft YaHei',sans-serif; background:#F8F9FA; margin:0; padding:24px; }
    .scrollbar-thin::-webkit-scrollbar { width: 4px; height: 4px; }
    .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: #E5E7EB; border-radius: 2px; }
    .panel-header { display:flex; align-items:center; justify-content:space-between; padding:10px 12px; border-bottom:1px solid #E5E7EB; background:#fff; }
    .output-doc { background:#FFFFFF; border:1px solid #E5E7EB; border-radius:12px; overflow:hidden; transition:all 0.2s ease; }
    .output-doc.drag-over { border-color:#1A1A1A; box-shadow:0 0 0 3px rgba(0,0,0,0.06); }
    .output-doc-head { display:flex; align-items:center; justify-content:space-between; padding:8px 10px; gap:8px; }
    .output-doc:not(.collapsed) .output-doc-head { border-bottom:1px solid #F3F4F6; }
    .output-doc-title-wrap { display:flex; align-items:center; gap:6px; min-width:0; flex:1; }
    .output-doc-emoji { display:inline-flex; align-items:center; }
    .output-doc-title { flex:1; min-width:0; border:none; outline:none; background:transparent; font-size:13px; font-weight:600; color:#1A1A1A; padding:4px 2px; }
    .output-doc-title:focus { background:#F9FAFB; border-radius:6px; }
    .output-doc-actions { display:flex; align-items:center; gap:4px; }
    .output-doc-actions button { display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px; border:none; background:transparent; border-radius:6px; color:#6B7280; cursor:pointer; }
    .output-doc-actions button:hover { background:#F3F4F6; color:#1A1A1A; }
    .output-doc-actions button.active { background:#1A1A1A; color:#fff; }
    .output-type-toggle { display:inline-flex; border:1px solid #E5E7EB; border-radius:6px; overflow:hidden; }
    .output-type-toggle button { border-radius:0 !important; width:24px !important; height:24px !important; }
    .output-type-toggle button + button { border-left:1px solid #E5E7EB; }
    .output-doc-del:hover { background:#FEE2E2 !important; color:#DC2626 !important; }
    .output-doc-body { padding:6px 10px 10px; }
    .output-doc.collapsed .output-doc-body { display:none; }
    .output-list { list-style:none; margin:0; padding:0; }
    .output-list-ol { list-style:none; counter-reset:ol; }
    .output-list-ol .output-item { counter-increment:ol; }
    .output-list-ol .output-marker::before { content:counter(ol) "."; color:#1A1A1A; font-weight:600; min-width:18px; text-align:right; }
    .output-list-ul .output-marker::before { content:"·"; color:#6B7280; font-weight:700; font-size:16px; line-height:1; min-width:14px; text-align:center; }
    .output-item { display:flex; align-items:center; gap:6px; padding:5px 4px; border-radius:6px; transition:background 0.15s; }
    .output-item:hover { background:#F9FAFB; }
    .output-marker { display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto; font-size:12px; color:#6B7280; }
    .output-text-input { flex:1; min-width:0; border:none; outline:none; background:transparent; font-size:13px; color:#1A1A1A; padding:2px 4px; }
    .output-text-input:focus { background:#F3F4F6; border-radius:4px; }
    .output-ref-chip { flex:1; min-width:0; display:inline-flex; align-items:center; gap:6px; padding:4px 8px; background:#F3F4F6; border:1px solid #E5E7EB; border-radius:6px; font-size:12px; color:#1A1A1A; }
    .output-ref-text { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .output-item-del { display:none; align-items:center; justify-content:center; width:20px; height:20px; border:none; background:transparent; border-radius:4px; color:#9CA3AF; cursor:pointer; flex:0 0 auto; }
    .output-item:hover .output-item-del { display:inline-flex; }
    .output-item-del:hover { background:#FEE2E2; color:#DC2626; }
    .output-add-row { display:flex; align-items:center; gap:4px; margin-top:6px; padding:0 4px; }
    .output-add-input { flex:1; min-width:0; border:1px solid #E5E7EB; outline:none; background:#fff; font-size:12px; color:#1A1A1A; padding:6px 8px; border-radius:6px; }
    .output-add-input:focus { border-color:#1A1A1A; }
    .output-add-btn { display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px; border:1px solid #1A1A1A; background:#1A1A1A; color:#fff; border-radius:6px; cursor:pointer; flex:0 0 auto; }
    .output-add-btn:hover { background:#333; }
    .output-drop-hint { margin-top:6px; padding:6px 8px; text-align:center; font-size:11px; color:#9CA3AF; border:1px dashed #E5E7EB; border-radius:6px; }
  </style>
</head>
<body>
  <div style="display:flex; gap:24px; align-items:flex-start;">
    <div>
      <div style="font-size:12px; color:#6B7280; margin-bottom:8px;">产出物分栏（带 seed 演示数据）</div>
      <div id="demo" style="width:340px; height:640px; border:1px solid #E5E7EB; border-radius:8px; overflow:hidden; background:#fff;"></div>
    </div>
    <div>
      <div style="font-size:12px; color:#6B7280; margin-bottom:8px;">可拖动源：左侧合集卡片 + 中间素材卡片</div>
      <div id="sources" style="display:flex; flex-direction:column; gap:8px;">
        <div class="collection-item" draggable="true" data-fb-drag="collection" style="padding:8px 12px; background:#F3F4F6; border-radius:6px; cursor:grab; font-size:13px;">合集：设计灵感 <span style="background:#fff; padding:1px 6px; border-radius:10px; font-size:11px; margin-left:6px;">4</span></div>
        <div class="collection-item" draggable="true" style="padding:8px 12px; background:#F3F4F6; border-radius:6px; cursor:grab; font-size:13px;">合集：穿着搭配 <span style="background:#fff; padding:1px 6px; border-radius:10px; font-size:11px; margin-left:6px;">2</span></div>
        <div class="collection-item" draggable="true" style="padding:8px 12px; background:#F3F4F6; border-radius:6px; cursor:grab; font-size:13px;">合集：网页工具 <span style="background:#fff; padding:1px 6px; border-radius:10px; font-size:11px; margin-left:6px;">28</span></div>
        <div style="margin-top:16px; font-size:12px; color:#6B7280;">素材卡</div>
        <div draggable="true" data-fb-drag="material" data-material-id="1001" data-material-title="火山方舟Agent Plan个人版" data-material-collection="Agent搭建" data-material-url="https://www.volcengine.com/" style="width:160px; padding:8px; background:#fff; border:1px solid #E5E7EB; border-radius:6px; cursor:grab; font-size:12px;">火山方舟Agent Plan个人版</div>
        <div draggable="true" data-fb-drag="material" data-material-id="1002" data-material-title="苍苍APP广场收藏夹" data-material-collection="穿着搭配" data-material-url="https://cangcang.app/" style="width:160px; padding:8px; background:#fff; border:1px solid #E5E7EB; border-radius:6px; cursor:grab; font-size:12px;">苍苍APP广场收藏夹</div>
      </div>
    </div>
  </div>
  <script src="/js/output-docs.js"></script>
  <script>
    // 给左侧合集卡加 payload（不破坏原排序：独立 dragstart listener）
    document.querySelectorAll('.collection-item').forEach((el) => {
      const name = (el.textContent || '').split(/\s+/)[0].replace('合集：','');
      const badge = el.querySelector('span');
      const count = badge ? parseInt(badge.textContent, 10) || 0 : 0;
      el.addEventListener('dragstart', (e) => {
        try { e.dataTransfer.setData(OutputDocs.CARD_MIME, JSON.stringify({ kind: 'collection', name, count })); } catch(err){}
      });
    });
    // 渲染产出物分栏
    OutputDocs.renderPanel({
      container: document.getElementById('demo'),
      collection: 'Agent搭建',
      onClose: () => alert('关闭'),
      onAi: () => alert('AI 总结'),
    });
  </script>
</body>
</html>
