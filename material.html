<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Foubow - 截图素材管理</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .scrollbar-thin::-webkit-scrollbar { width: 4px; height: 4px; }
    .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: #E5E7EB; border-radius: 2px; }

    /* ===== 所有素材网格 ===== */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px;
    }

    /* ===== 合集详情 2 列 ===== */
    .collection-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    @media (max-width: 640px) { .collection-grid { grid-template-columns: 1fr; } }

    /* ===== Sidebar ===== */
    @media (min-width: 1024px) {
      #sidebar { position: static !important; transform: none !important; }
      #sidebar-overlay { display: none !important; }
    }
    @media (max-width: 1023px) {
      #sidebar {
        position: fixed; top: 0; left: 0;
        height: 100vh; width: 260px; z-index: 50;
        transform: translateX(-100%);
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        overflow-y: auto;
      }
      #sidebar.open { transform: translateX(0); }
    }
    #sidebar-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 40;
      opacity: 0; visibility: hidden;
      transition: opacity 0.3s, visibility 0.3s;
    }
    #sidebar-overlay.open { opacity: 1; visibility: visible; }

    /* ===== Collection 编辑按钮 ===== */
    .collection-item { position: relative; }
    .collection-item .collection-edit-btn {
      opacity: 0; transition: opacity 0.15s;
    }
    .collection-item:hover .collection-edit-btn { opacity: 1; }

    /* ===== 总览 2 列网格 ===== */
    .overview-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }
    @media (max-width: 640px) {
      .overview-grid { grid-template-columns: 1fr; }
    }

    .collection-section {
      background: #F8F9FA;
      border: 1px solid #EAECF0;
      border-radius: 12px;
      padding: 16px;
    }
    .collection-section .section-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 12px;
    }
    .collection-section .section-header h2 {
      font-size: 13px; font-weight: 600; color: #1A1A1A;
    }
    .collection-section .section-header .count {
      font-size: 11px; font-weight: 400; color: #9CA3AF; margin-left: 6px;
    }
    .collection-section .collection-name-link {
      cursor: pointer; transition: color 0.15s;
    }
    .collection-section .collection-name-link:hover { color: #4B5563; }
    .collection-section .more-link {
      font-size: 11px; color: #6B7280; cursor: pointer;
      display: flex; align-items: center; gap: 2px;
      transition: color 0.15s;
    }
    .collection-section .more-link:hover { color: #1A1A1A; }

    /* 合集内迷你卡片 */
    .mini-cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    @media (max-width: 1100px) { .mini-cards { grid-template-columns: repeat(3, 1fr); } }

    .mini-card {
      border-radius: 6px; overflow: hidden; cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      border: 1px solid #E5E7EB; background: white;
    }
    .mini-card:hover {
      transform: scale(1.05);
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    /* ===== Right Panel ===== */
    #detail-desktop {
      flex-shrink: 0; border-left: 1px solid #E5E7EB;
      background: white; overflow: hidden;
    }
    #detail-desktop .panel-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; border-bottom: 1px solid #E5E7EB;
      position: sticky; top: 0; background: white; z-index: 5;
    }

    /* Panel 瀑布流 */
    .panel-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px; padding: 12px;
    }
    .panel-card {
      border: 1px solid #E5E7EB; border-radius: 8px;
      overflow: hidden; cursor: pointer; background: white;
      transition: box-shadow 0.15s;
    }
    .panel-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.08); }

    /* ===== Mobile 面板 ===== */
    #detail-mobile {
      position: fixed; inset: 0; z-index: 70; background: white;
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      overflow-y: auto;
    }
    #detail-mobile.open { transform: translateY(0); }
    #detail-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 60;
      opacity: 0; visibility: hidden;
      transition: opacity 0.3s, visibility 0.3s;
    }
    #detail-overlay.open { opacity: 1; visibility: visible; }
    @media (min-width: 1024px) {
      #detail-overlay, #detail-mobile { display: none !important; }
    }

    /* ===== Modal ===== */
    #modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 80;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; visibility: hidden;
      transition: opacity 0.2s, visibility 0.2s;
    }
    #modal-overlay.open { opacity: 1; visibility: visible; }
    .modal-content {
      background: white; border-radius: 12px; padding: 24px;
      width: 360px; max-width: 90vw;
      transform: scale(0.95); transition: transform 0.2s;
    }
    #modal-overlay.open .modal-content { transform: scale(1); }
    #collection-select-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 80;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; visibility: hidden;
      transition: opacity 0.2s, visibility 0.2s;
    }
    #collection-select-overlay.open { opacity: 1; visibility: visible; }
    #collection-select-overlay.open .modal-content { transform: scale(1); }

    /* ===== 上传弹窗 ===== */
    #upload-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 60;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; visibility: hidden;
      transition: opacity 0.2s, visibility 0.2s;
    }
    #upload-overlay.open { opacity: 1; visibility: visible; }
    .upload-modal {
      background: white; border-radius: 12px;
      width: 640px; max-width: 95vw; max-height: 85vh;
      display: flex; flex-direction: column; overflow: hidden;
      transform: scale(0.95); transition: transform 0.2s;
    }
    #upload-overlay.open .upload-modal { transform: scale(1); }
    @media (max-width: 640px) {
      .upload-modal { width: 100vw; max-width: 100vw; max-height: 100vh; border-radius: 0; }
    }
    .upload-dropzone {
      border: 2px dashed #D1D5DB; border-radius: 8px;
      padding: 28px 16px; text-align: center; cursor: pointer;
      margin: 16px 20px; flex-shrink: 0;
      transition: border-color 0.15s, background 0.15s;
    }
    .upload-dropzone:hover,
    .upload-dropzone.drag-over { border-color: #1A1A1A; background: #F8F9FA; }
    .upload-image-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
      padding: 0 20px 16px; overflow-y: auto; flex: 1; min-height: 0;
      align-content: start;
    }
    @media (max-width: 640px) { .upload-image-grid { grid-template-columns: repeat(2, 1fr); } }
    .upload-image-item {
      border: 1px solid #E5E7EB; border-radius: 8px;
      padding: 8px; background: white; display: flex; flex-direction: column;
    }
    .upload-thumb {
      width: 100%; aspect-ratio: 1; object-fit: cover;
      border-radius: 4px; background: #F3F4F6;
    }
    .upload-image-item .file-name {
      font-size: 11px; color: #6B7280;
      margin: 6px 0; line-height: 1.3;
      display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden; word-break: break-all;
    }
  </style>
</head>
<body class="bg-white h-screen overflow-hidden flex">

  <div id="sidebar-overlay" onclick="closeSidebar()"></div>

  <!-- ===== Sidebar ===== -->
  <aside id="sidebar" class="w-[220px] h-screen bg-[#F8F9FA] border-r border-[#E5E7EB] flex flex-col shrink-0 lg:!static lg:!transform-none">
    <div class="px-5 py-5 shrink-0">
      <h1 class="text-lg font-bold text-[#1A1A1A] tracking-tight"><a href="index.html" class="hover:text-[#4B5563] transition-colors cursor-pointer">Foubow</a></h1>
    </div>
    <nav class="px-3 flex flex-col gap-0.5 shrink-0">
      <button id="nav-all" onclick="selectCollection('all')"
        class="flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm transition-colors duration-150 bg-white text-[#1A1A1A] font-medium shadow-sm">
        <i data-lucide="layers" class="w-4 h-4"></i>
        所有素材
      </button>
    </nav>
    <div class="px-5 mt-5 mb-2 shrink-0">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2.5 text-sm font-medium text-[#1A1A1A]">
          <i data-lucide="folder-open" class="w-4 h-4"></i>
          我的合集
        </div>
        <button onclick="navigateTo('overview')" id="btn-overview" title="总览"
          class="px-2.5 py-1 text-xs rounded-md bg-[#1A1A1A] text-white hover:bg-[#333] transition-colors">总览</button>
      </div>
    </div>
    <div class="px-3 mt-5 flex-1 overflow-y-auto scrollbar-thin">
      <div class="flex flex-col gap-1.5" id="collection-buttons"></div>
    </div>
  </aside>

  <!-- ===== Main ===== -->
  <div class="flex-1 flex flex-col min-w-0">
    <header class="h-14 bg-white border-b border-[#E5E7EB] flex items-center justify-between px-6 shrink-0 gap-4">
      <button id="hamburger-btn" class="lg:hidden p-2 -ml-2 rounded-md hover:bg-[#F3F4F6]" onclick="openSidebar()">
        <i data-lucide="menu" class="w-5 h-5 text-[#1A1A1A]"></i>
      </button>
      <div class="flex-1 lg:hidden"></div>
      <div class="flex items-center gap-3">
        <div id="header-avatar" class="w-8 h-8 rounded-full bg-[#E5E7EB] flex items-center justify-center overflow-hidden">
          <i data-lucide="user" class="w-4 h-4 text-[#9CA3AF]"></i>
        </div>
        <div class="flex flex-col">
          <span id="header-nickname" class="text-sm font-medium text-[#1A1A1A] leading-tight">昵称</span>
          <span id="header-email" class="text-xs text-[#9CA3AF] leading-tight">yourEmail@foubow.fun</span>
        </div>
      </div>
      <button onclick="openUploadModal()" class="flex items-center gap-1.5 px-4 py-2 bg-[#1A1A1A] text-white text-sm font-medium rounded-lg hover:bg-[#333] transition-colors duration-150">
        <i data-lucide="upload" class="w-3.5 h-3.5"></i>
        上传
      </button>
    </header>

    <!-- Content: 主视图 + 右侧面板 -->
    <div class="flex-1 flex overflow-hidden">
      <div id="main-content" class="flex-1 overflow-y-auto p-6 scrollbar-thin"></div>
      <div id="detail-desktop" class="w-[340px] shrink-0 border-l border-[#E5E7EB] bg-white lg:flex flex-col hidden" style="display:none">
        <div id="panel-content" class="flex-1 overflow-y-auto scrollbar-thin"></div>
      </div>
    </div>
  </div>

  <!-- ===== Mobile Panel ===== -->
  <div id="detail-overlay" onclick="closeMobilePanel()"></div>
  <div id="detail-mobile"></div>

  <!-- ===== 合集编辑 Modal ===== -->
  <div id="modal-overlay" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <h3 id="modal-title" class="text-base font-semibold text-[#1A1A1A] mb-4">添加合集</h3>
      <input id="modal-input" type="text" placeholder="合集名称" maxlength="20" class="w-full px-3 py-2 border border-[#E5E7EB] rounded-lg text-sm mb-4 focus:outline-none focus:border-[#1A1A1A] transition-colors">
      <div class="flex items-center justify-between">
        <button id="modal-delete-btn" class="px-3 py-2 text-sm text-red-500 hover:bg-red-50 rounded-lg transition-colors hidden" onclick="deleteCollection()">删除合集</button>
        <div class="flex gap-2 ml-auto">
          <button class="px-4 py-2 text-sm text-[#6B7280] hover:bg-[#F3F4F6] rounded-lg transition-colors" onclick="closeModal()">取消</button>
          <button class="px-4 py-2 text-sm bg-[#1A1A1A] text-white rounded-lg hover:bg-[#333] transition-colors" onclick="saveCollection()">保存</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== 修改素材合集 Modal ===== -->
  <div id="collection-select-overlay" onclick="closeCollectionSelect()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <h3 class="text-base font-semibold text-[#1A1A1A] mb-4">修改所属合集</h3>
      <select id="collection-select" class="w-full px-3 py-2 border border-[#E5E7EB] rounded-lg text-sm mb-4 focus:outline-none focus:border-[#1A1A1A] transition-colors bg-white"></select>
      <div class="flex gap-2 justify-end">
        <button class="px-4 py-2 text-sm text-[#6B7280] hover:bg-[#F3F4F6] rounded-lg transition-colors" onclick="closeCollectionSelect()">取消</button>
        <button class="px-4 py-2 text-sm bg-[#1A1A1A] text-white rounded-lg hover:bg-[#333] transition-colors" onclick="changeCollection()">保存</button>
      </div>
    </div>
  </div>

  <!-- ===== 上传弹窗 ===== -->
  <div id="upload-overlay" onclick="closeUploadModal()">
    <div class="upload-modal" onclick="event.stopPropagation()">
      <div class="flex items-center justify-between px-5 py-4 border-b border-[#E5E7EB] shrink-0">
        <h3 class="text-base font-semibold text-[#1A1A1A]">上传素材</h3>
        <button onclick="closeUploadModal()" class="p-1 rounded-md hover:bg-[#F3F4F6] transition-colors"><i data-lucide="x" class="w-4 h-4 text-[#6B7280]"></i></button>
      </div>
      <div id="upload-dropzone" class="upload-dropzone"
        onclick="document.getElementById('upload-file-input').click()"
        ondragover="event.preventDefault();document.getElementById('upload-dropzone').classList.add('drag-over')"
        ondragleave="document.getElementById('upload-dropzone').classList.remove('drag-over')"
        ondrop="event.preventDefault();document.getElementById('upload-dropzone').classList.remove('drag-over');handleUploadFiles(event.dataTransfer.files)">
        <i data-lucide="image-plus" class="w-8 h-8 text-[#9CA3AF] mx-auto mb-2"></i>
        <div class="text-sm text-[#6B7280]">拖拽图片到此或<span class="text-[#1A1A1A] font-medium">点击上传</span></div>
        <div class="text-xs text-[#9CA3AF] mt-1">支持 JPG、PNG、WebP 格式，单次仅可上传 1 张</div>
      </div>
      <input type="file" id="upload-file-input" accept="image/*" class="hidden" onchange="handleUploadFiles(this.files);this.value=''">
      <div class="px-5 py-2 shrink-0 flex items-center justify-between">
        <span class="text-xs text-[#9CA3AF]">已添加 <span id="upload-count" class="font-medium text-[#6B7280]">0</span> 张图片</span>
        <button onclick="uploadImages=[];renderUploadList()" class="text-xs text-[#9CA3AF] hover:text-[#EF4444] transition-colors">清空</button>
      </div>
      <div id="upload-image-list" class="upload-image-grid"></div>
      <div class="shrink-0 px-5 py-4 border-t border-[#E5E7EB] flex justify-end gap-2">
        <button onclick="closeUploadModal()" class="px-4 py-2 text-sm text-[#6B7280] hover:bg-[#F3F4F6] rounded-lg transition-colors">取消</button>
        <button onclick="confirmUpload()" class="px-4 py-2 text-sm bg-[#1A1A1A] text-white rounded-lg hover:bg-[#333] transition-colors">确认上传</button>
      </div>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/materials.js"></script>
</body>
</html>
