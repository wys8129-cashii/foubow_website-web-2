<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foubow 管理后台 · 打赏白名单</title>
<link rel="stylesheet" href="/css/tailwind.css">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<style>
  .glass-card { background: rgba(255,255,255,0.7); border: 1px solid rgba(0,0,0,0.06); backdrop-filter: blur(10px); }
  .field { border: 1px solid #e5e7eb; border-radius: 10px; padding: 10px 12px; font-size: 14px; width: 100%; outline: none; }
  .field:focus { border-color: #06b6d4; }
</style>
</head>
<body class="bg-surface-container-lowest min-h-screen font-body-md text-on-surface">

<!-- 登录视图 -->
<div id="login-view" class="min-h-screen flex items-center justify-center px-4">
  <div class="glass-card w-full max-w-sm p-8 rounded-2xl shadow-lg">
    <div class="flex items-center gap-2 mb-6">
      <span class="material-symbols-outlined text-primary text-3xl">admin_panel_settings</span>
      <h1 class="font-headline-lg text-headline-lg text-primary">管理后台</h1>
    </div>
    <p class="text-on-surface-variant text-sm mb-6">打赏白名单审核 · 使用 Foubow 管理员账号登录</p>
    <div class="space-y-4">
      <input id="admin-email" class="field" type="email" placeholder="管理员邮箱" autocomplete="username">
      <input id="admin-pwd" class="field" type="password" placeholder="密码" autocomplete="current-password" onkeydown="if(event.key==='Enter')adminLogin()">
      <button id="admin-login-btn" class="w-full px-4 py-3 bg-primary text-on-primary rounded-xl font-title-md shadow-lg hover:shadow-cyan-500/30 active:scale-95 transition-all flex items-center justify-center gap-2">
        <span class="material-symbols-outlined">login</span> 登录
      </button>
      <a href="/index.html" class="block text-center text-sm text-on-surface-variant hover:text-primary">返回首页</a>
    </div>
  </div>
</div>

<!-- 后台视图 -->
<div id="admin-view" class="hidden max-w-container-max mx-auto px-4 md:px-8 py-10">
  <div class="flex items-center justify-between mb-8">
    <div class="flex items-center gap-3">
      <span class="material-symbols-outlined text-primary text-3xl">verified_user</span>
      <div>
        <h1 class="font-headline-lg text-headline-lg">打赏白名单审核</h1>
        <p class="text-sm text-on-surface-variant">当前管理员：<span id="admin-email-label" class="text-primary font-medium"></span></p>
      </div>
    </div>
    <div class="flex gap-2">
      <button onclick="loadPending()" class="px-4 py-2 bg-surface-container-highest rounded-lg flex items-center gap-1 hover:bg-surface-container-highest/70">
        <span class="material-symbols-outlined text-[18px]">refresh</span> 刷新
      </button>
      <a href="/index.html" class="px-4 py-2 bg-surface-container-highest rounded-lg flex items-center gap-1 hover:bg-surface-container-highest/70">
        <span class="material-symbols-outlined text-[18px]">home</span> 首页
      </a>
    </div>
  </div>

  <div class="mb-6 p-4 rounded-xl bg-primary/10 text-primary text-sm flex items-start gap-2">
    <span class="material-symbols-outlined text-[18px]">info</span>
    <span>用户打赏后需加管理员微信发送「打赏截图 + 订单号」，核对无误后在此点「添加白名单」即可开通权限。订单号见下方每条记录。</span>
  </div>

  <div id="pending-list" class="space-y-4">
    <div class="text-on-surface-variant p-4">加载中...</div>
  </div>
</div>

<script src="/js/config.js"></script>
<script src="/js/common.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
